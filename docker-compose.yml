version: '3.8'

services:
  # 1. L'API FastAPI accessible sur http://localhost:8000
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: wechat_agent_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app  # Hot-reload : vos modifications de code s'appliquent en temps réel
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload

  # 2. L'Ouvrier de l'ombre (Celery)
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: wechat_agent_worker
    env_file:
      - .env
    volumes:
      - .:/app

