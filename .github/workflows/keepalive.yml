name: Ping Render Server (Anti-Sleep)

on:
  schedule:
    # S'exécute toutes les 14 minutes pour empêcher l'endormissement de Render (qui s'éteint après 15m d'inactivité)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s https://wechat-agent-5y0i.onrender.com/health
