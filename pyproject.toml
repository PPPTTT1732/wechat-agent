[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-engineering-agent"
version = "1.0.0"
description = "AgentOps Platform for WeChat Engineering Teams"
requires-python = ">=3.11"
dependencies = [
"psycopg>=3.1.18",
"psycopg-binary>=3.1.18",
    "fastapi",
    "uvicorn",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "pgvector",
    "psycopg2-binary",
    "openai",
    "anthropic",
    "celery",
    "redis",
    "typer",
    "requests",
]

[project.scripts]
wechat-agent = "apps.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*"]
